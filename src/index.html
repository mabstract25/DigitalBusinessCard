<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital business Card</title>
</head>
<body>
    <div class="pagecontainer">
        <div class="mobilecontainer">
            <div class="headerimgcontainer"></div>
            <div class="profilepicture">
                <img id="profilepic" src="/src/images/Andynicol.png" alt="" class="profile fadeInLeft-animation">
            </div>
            <div class="personaldetails fadeInLeft-animation">
                <h2>Andy Nicol</h2>
                <h3>Chief Executive Officer</h3>
                <div class="pgrid fadeInLeft-animation" id="profilegrid">
                    <div class="pitem">
                        <div class="icon"><img src="/src/icons/mobile.svg" alt=""></div>
                        <div class="ptext">
                            <a href="tel:07785 535 084">
                                <p>07785 535 084</p>
                            </a>
                        </div>
                    </div>
                    <div class="pitem">
                        <div class="icon"><img src="/src/icons/email.svg" alt=""></div>
                        <div class="ptext">
                            <a href="mailto:andy@abstractuk.co.uk">
                                <p>Andy@abstractuk.co.uk</p>
                            </a>
                    </div>
                    </div>
                    <div class="pitem">
                        <div class="icon"><img src="/src/icons/web.svg" alt=""></div>
                        <div class="ptext">
                            <a href="https://www.abstractuk.co.uk/">
                                <p>www.abstractuk.co.uk</p>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="andycode" class="code fadeInLeft-animation">
            </div>
            <div class="termsandconditions"></div>
        </div>
    </div>
</body>
</html>
