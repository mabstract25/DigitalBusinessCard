<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital business Card</title>
</head>
<body>
    <div class="pagecontainer">
        <div class="mobilecontainer">
            <div class="headerimgcontainer"></div>
            <div class="profilepicture">
                <img src="/src/images/Andynicol.png" alt="" class="profile">
            </div>
            <div class="personaldetails">
                <h2>Andy Nicol</h2>
                <h3>Chief Executive Officer</h3>
                <div class="pgrid">
                    <div class="pitem">
                        <div class="icon"><img src="/src/icons/mobile.svg" alt=""></div>
                        <div class="ptext"><p>07785 535 084</p></div>
                    </div>
                    <div class="pitem">
                        <div class="icon"><img src="/src/icons/email.svg" alt=""></div>
                        <div class="ptext"><p>Andy@abstractuk.co.uk</p></div>
                    </div>
                    <div class="pitem">
                        <div class="icon"><img src="/src/icons/web.svg" alt=""></div>
                        <div class="ptext"><p>www.abstractuk.co.uk</p></div>
                    </div>
                </div>
            </div>
            <div class="code">
            </div>
            <div class="termsandconditions"></div>
        </div>
    </div>
</body>
</html>
