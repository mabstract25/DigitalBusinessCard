<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital business Card</title>
<script defer src="main.js"></script></head>
<body>
    <div class="pagecontainer">
        <div class="mobilecontainer">
            <div class="headerimgcontainer"></div>
            <div class="profilepicture">
                <img id="profilepic" src="19658ab4b7661a771d52.png" alt="" class="profile fadeInLeft-animation">
            </div>
            <div class="personaldetails fadeInLeft-animation">
                <h2>Mark Fryer</h2>
                <h3>Chief Client Officer</h3>
                <div class="pgrid fadeInLeft-animation" id="profilegrid">
                    <div class="pitem">
                        <div class="icon"><img src="8d510be3ba39b930c6b1.svg" alt=""></div>
                        <div class="ptext">
                            <a href="tel:07791 245 396">
                                <p>07791 245 396</p>
                            </a>
                        </div>
                    </div>
                    <div class="pitem">
                        <div class="icon"><img src="b850578cbe715d3a8f2e.svg" alt=""></div>
                        <div class="ptext">
                            <a href="mailto:mark@abstractuk.co.uk">
                                <p>Mark@abstractuk.co.uk</p>
                            </a>
                    </div>
                    </div>
                    <div class="pitem">
                        <div class="icon"><img src="307c0c7802f746ccfeac.svg" alt=""></div>
                        <div class="ptext">
                            <a href="https://www.abstractuk.co.uk/">
                                <p>www.abstractuk.co.uk</p>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div id="markcode" class="code fadeInLeft-animation">
            </div>
            <div class="termsandconditions"></div>
        </div>
    </div>
</body>
</html>
